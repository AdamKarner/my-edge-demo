<style>
/* My Edge v2 shared styles. EDS greens only: 356 C #007A33, 3305 C #004E42 */
:root{--g:#007A33;--dg:#004E42;--bg:#F2F4F0;--card:#fff;--line:#DCE3DD;--ink:#14211C;--ink2:#55645D;--tint:#E3F0E6;--ondk:#CFE6D6;--amb-bg:#FFF4D6;--amb-ln:#EBCB7A;--amb-tx:#7A4F00;--amb-fill:#B07D0A;--red-bg:#FDE3DF;--red-tx:#9B2C1F;--blu-bg:#DCEBFA;--blu-tx:#1F4E80;--void:#6E7C74}
*{box-sizing:border-box}
.ah{font-family:Figtree,system-ui,sans-serif;color:var(--ink);background:var(--bg);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.ah button,.ah input,.ah select{font-family:inherit}
:where(.ah) button{color:inherit}
.phone{width:390px;height:844px;position:relative;overflow:hidden;display:flex;flex-direction:column}
.tab{width:1024px;height:768px;display:flex;overflow:hidden}
/* brand header: deep green with the enduranceds.com grid texture */
.hero{background-color:var(--dg);background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:22px 22px;color:#fff;padding:20px 16px 18px;border-radius:0 0 28px 28px}
.side{width:208px;flex:none;background-color:var(--dg);background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:22px 22px;color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.mark{width:36px;height:36px;border-radius:10px;background:#fff;color:var(--dg);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;letter-spacing:.02em}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.eb-g{color:var(--g)}.eb-on{color:var(--ondk)}
.t1{font-size:26px;font-weight:800;line-height:1.15;margin:0}
.t2{font-size:18px;font-weight:800;margin:0}
.t3{font-size:16px;font-weight:700;margin:0}
.xl{font-size:52px;font-weight:800;line-height:1;letter-spacing:-.02em}
.lg{font-size:30px;font-weight:800;line-height:1.05}
.md{font-size:22px;font-weight:800;line-height:1.1}
.sm{font-size:13px;font-weight:600;color:var(--ink2)}
.sm-on{font-size:13px;font-weight:600;color:var(--ondk)}
.body{flex:1;overflow:hidden;padding:14px 16px 0;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.col{display:flex;flex-direction:column}
.g4{gap:4px}.g8{gap:8px}.g12{gap:12px}
.asof{font-size:12px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:6px}
.asof-on{color:var(--ondk)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--g);display:inline-block}
/* segmented control on dark */
.seg{display:flex;background:rgba(255,255,255,.12);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;height:44px;border:0;border-radius:999px;background:transparent;color:#fff;font-size:14px;font-weight:700}
.seg button.on{background:#fff;color:var(--dg)}
.seg-l{display:flex;background:#E6EBE7;border-radius:999px;padding:4px;gap:4px}
.seg-l button{flex:1;height:44px;border:0;border-radius:999px;background:transparent;font-size:14px;font-weight:700;color:var(--ink2)}
.seg-l button.on{background:#fff;color:var(--dg);box-shadow:0 1px 2px rgba(20,33,28,.12)}
/* buttons */
.btn{height:48px;border-radius:999px;border:0;background:var(--g);color:#fff;font-size:15px;font-weight:700;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-o{height:48px;border-radius:999px;border:2px solid var(--g);background:#fff;color:var(--g);font-size:15px;font-weight:700;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-s{height:44px;font-size:14px;padding:0 16px}
.btn-w{height:48px;border-radius:999px;border:0;background:#fff;color:var(--dg);font-size:15px;font-weight:700;padding:0 18px}
.icb{width:44px;height:44px;border-radius:999px;border:0;background:var(--tint);color:var(--dg);display:inline-flex;align-items:center;justify-content:center;flex:none}
.icb-g{background:var(--g);color:#fff}
.icb-on{background:rgba(255,255,255,.14);color:#fff}
/* status tags: always text, never color alone */
.tag{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.t-act{background:var(--tint);color:var(--dg)}
.t-amb{background:var(--amb-bg);color:var(--amb-tx);border:1px solid var(--amb-ln)}
.t-red{background:var(--red-bg);color:var(--red-tx)}
.t-blu{background:var(--blu-bg);color:var(--blu-tx)}
.t-gry{background:#E8ECE9;color:#46524B}
/* stacked bar */
.bar{display:flex;gap:3px;height:14px}
.bar span{border-radius:4px;display:block}
.b-g{background:var(--g)}.b-a{background:var(--amb-fill)}.b-v{background:var(--void)}.b-r{background:var(--red-tx)}.b-dg{background:var(--dg)}.b-l{background:#9DBFA9}
.key{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
/* lists */
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0;padding-top:0}
.li:last-child{padding-bottom:0}
.grow{flex:1;min-width:0}
.right{text-align:right}
.alert{background:var(--amb-bg);border:1px solid var(--amb-ln);border-radius:18px;padding:14px 16px}
.over{background:var(--red-bg);border-radius:18px;padding:14px 16px}
/* bottom nav */
.nav{height:84px;flex:none;background:#fff;border-top:1px solid var(--line);display:flex;padding:8px 6px 20px}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--ink2);text-decoration:none;border-radius:14px}
.nav a.on{color:var(--dg);font-weight:800}
.nav a.on .pill{background:var(--tint)}
.pill{width:56px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center}
.sb a{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:12px;color:#fff;text-decoration:none;font-size:15px;font-weight:600}
.sb a.on{background:#fff;color:var(--dg);font-weight:800}
.sb .sub{height:44px;padding-left:44px;font-size:14px;color:var(--ondk)}
/* forms */
.lbl{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:6px;display:block}
.inp{height:48px;border:1.5px solid #9FB0A6;border-radius:12px;background:#fff;padding:0 14px;font-size:15px;width:100%;display:flex;align-items:center}
.chk{width:24px;height:24px;border-radius:7px;border:2px solid #7E8F85;display:inline-flex;align-items:center;justify-content:center;flex:none;background:#fff}
.chk.on{background:var(--g);border-color:var(--g);color:#fff}
.opt{display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 14px;border:1.5px solid var(--line);border-radius:14px;background:#fff}
.opt.on{border-color:var(--g);background:#F4FAF5}
.dock{flex:none;background:#fff;border-top:1px solid var(--line);padding:12px 16px 26px;display:flex;gap:10px}
.steps{display:flex;gap:4px}
.steps span{flex:1;height:6px;border-radius:3px;background:#C9D3CC}
.steps span.d{background:var(--g)}
.steps span.n{background:var(--dg);outline:2px solid var(--g);outline-offset:1px}
.scrim{position:absolute;inset:0;background:rgba(10,30,24,.55)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:28px 28px 0 0;padding:12px 20px 30px;display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:5px;border-radius:3px;background:#C9D3CC;align-self:center}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;font-weight:700;color:var(--ink2);text-align:right;padding:0 0 8px;letter-spacing:.04em;text-transform:uppercase}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:11px 0;border-top:1px solid var(--line);text-align:right;font-weight:600}
.lock{background:#E8ECE9;color:#2E3A34;border-radius:14px;padding:10px 12px;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center}
.dash{border:1.5px dashed #9FB0A6;border-radius:14px;padding:12px;font-size:13px;color:var(--ink2)}

.hero input::placeholder{color:#CFE6D6}
.self{align-self:flex-start;display:flex}
.dev .opt{width:100%}

:root{--st-bg:#E9EDE9;--st-ink:#14211C;--st-ink2:#55645D;--st-line:#C0CBC4;--st-card:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--st-bg:#0E1814;--st-ink:#E6EEE9;--st-ink2:#A9B8B0;--st-line:#31423A;--st-card:#16241D}}
:root[data-theme="dark"]{--st-bg:#0E1814;--st-ink:#E6EEE9;--st-ink2:#A9B8B0;--st-line:#31423A;--st-card:#16241D}
html,body{margin:0;min-height:100%;background:var(--st-bg);color:var(--st-ink);font-family:Figtree,system-ui,sans-serif}
#bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:center;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 8px}

function commCard(p,title){const c=p.c,t=c[0]+c[1]+c[2],pct=t?Math.round(c[0]/t*100):0;
 return `<section class="card v15-commission-card col g12"><div class="between"><span class="eyebrow eb-g">${title||'Commission on contracts written'}</span><button class="v15-detail-link" ${da('openSheet',{t:'commissionDetails'})}>View details ${ic('next',15)}</button></div><div class="v15-commission-total">${usd(t)}</div><span class="sm">Total written commission · Month to date</span><div class="v15-commission-buckets">${[['Actual','Paid and activated','b-g',0,'actual'],['Potential','Awaiting payment or activation','b-a',1,'potential'],['Voided','Lost to voided contracts','b-v',2,'voided']].map(([name,desc,color,i,k])=>`<button class="v15-commission-bucket" ${da('openSheet',{t:'commissionDetails',bucket:k})}><span class="v15-bucket-name"><span class="key ${color}"></span>${name}</span><b>${usd(c[i])}</b><small>${desc}</small></button>`).join('')}</div>${bar([['b-g',c[0]],['b-a',c[1]],['b-v',c[2]]])}<div class="between"><span class="sm">${pct}% of written commission is Actual</span><button class="v15-detail-link" ${da('openSheet',{t:'commissionDetails',bucket:'potential'})}>Review Potential ${ic('next',14)}</button></div></section>`}

function needsCard(hideHeaderBadge=false){const it=[];if(S.hill!=='collected')it.push(`<div class="li"><div class="grow col g4"><span class="t3">Hilltop Auto</span><span class="sm">15 contracts at 76+ days. Collect before Fri, Oct 30.${S.hill==='called'?' Called today.':''}</span>${S.hill!=='called'?'<span class="sm" style="color:#9B2C1F;font-weight:800">$2,100 in commission at risk</span>':''}</div><button class="btn btn-s" ${da('openSheet',{t:'required'})}>Collect</button></div>`);
 S.leads.filter(l=>l.id!=='hill'&&(l.status==='new'||l.status==='overdue')).forEach(l=>it.push(`<div class="li"><button class="rowbtn grow" style="border:0;padding:0" ${da('dealer',{id:l.id})}><span class="col g4"><span class="row g8"><span class="t3">${esc(l.name)}</span>${tag(STL[l.status][0],STL[l.status][1])}</span><span class="sm">${esc(l.sub)}</span></span></button>${callBtn(l.id,l.name)}</div>`));
 return `<section class="card col g8">${hideHeaderBadge?'':'<div class="between"><span class="eyebrow eb-g">Needs attention</span>'}${hideHeaderBadge?'':it.length?tag('amb',it.length+' today'):tag('act','All clear')}${hideHeaderBadge?'':'</div>'}${it.length?it.join(''):`<div class="row g8" style="color:#004E42;font-weight:700">${ic('check',20,2.5)}Nothing needs you right now</div>`}${S.hill==='collected'?`<div class="row g8 sm" style="color:#004E42">${ic('check',16,2.5)}Hilltop Auto collected. Payment is pending.</div>`:''}</section>`}
function homeHero(eb,title,right,note){if(S.role==='mgr')right=v19SearchMarkup()+right;return hero({eb,title,big:1,right,extra:`<div class="seg" role="tablist" aria-label="Dashboard">${[['sales','Sales'],['claims','Claims']].map(([v,l])=>`<button class="${S.homeTab===v?'on':''}" role="tab" aria-selected="${S.homeTab===v}" ${da('homeTab',{v})}>${l}</button>`).join('')}</div>${note||''}<button class="asof asof-on" style="background:none;border:0;height:44px;padding:0;text-align:left" ${da('refresh')}><span class="dot" style="background:#9DE0B5"></span>Edge data as of ${S.asof}. Tap to refresh</button>`})}

function modernHomeActions(){return `<div class="modern-section"><b>Quick actions</b></div><div class="modern-actions">${[['plus','Add lead','openSheet',{t:'addlead'}],['cal','Log meeting','goto',{v:'crm'}],['doc','Rate card','goto',{v:'ratecard'}],['box','Supply order','goto',{v:'supply'}]].map(([i,t,a,o])=>`<button ${da(a,o)}><span class="ti">${ic(i,20)}</span>${t}</button>`).join('')}</div>`}
function modernHomeSummary(p){return `<section class="modern-summary"><div class="between"><div class="row g8"><span class="mark" style="width:33px;height:33px">EDS</span><div class="col g4"><b style="font-size:15px">Northshore Auto Group</b><span style="font-size:11px;opacity:.8">Your agency</span></div></div>${ic('next',20)}</div><div class="metrics"><div class="metric"><b>${fmt(p.n)}</b><span>Contracts this month</span></div><div class="metric"><b>${usd(p.c.reduce((a,b)=>a+b,0))}</b><span>EDS $ earned / written</span></div><div class="metric"><b>18</b><span>Days left to goal</span></div></div><div class="progress"><i></i></div><div style="text-align:right;font-size:11px;margin-top:5px;opacity:.8">200 contract goal</div></section>`}

 const list=L.filter(l=>(S.crmF==='all'||l.status===S.crmF)&&l.name.toLowerCase().includes(q)).sort((a,b)=>SO[a.status]-SO[b.status]);
 const b=`<div class="v5-top between"><div><span class="eyebrow eb-g">CRM</span><h1 class="v5-title">Leads & activity</h1><div class="v5-sub">Your dealers, follow-ups and conversations</div></div><button class="icb icb-g" aria-label="Add lead" ${da('openSheet',{t:'addlead'})}>${ic('plus',22)}</button></div><label class="v5-search">${ic('search',19)}<input data-bind="crmQ" data-live="1" placeholder="Search dealers or leads" value="${esc(S.crmQ)}" aria-label="Search dealers"></label>${chips([['all','All '+cnt('all')],['new','New '+cnt('new')],['follow','Follow ups '+cnt('follow')],['overdue','Overdue '+cnt('overdue')],['met','Met '+cnt('met')]],S.crmF,'crmF')}<div class="between"><b>Most urgent first</b>${tag('act','+40 EDS $ this week')}</div><div class="v5-list">${list.map(l=>`<div class="v5-list-item"><div class="v5-avatar">${esc(l.name.split(' ').slice(0,2).map(w=>w[0]).join(''))}</div><button class="grow col g4" style="border:0;background:none;text-align:left;padding:0" ${da('dealer',{id:l.id})}><span class="row g8"><span class="t3">${esc(l.name)}</span>${tag(STL[l.status][0],STL[l.status][1])}</span><span class="sm">${esc(l.sub)}</span>${l.id==='hill'&&S.hill!=='collected'?`<span class="sm" style="color:#9B2C1F">15 unpaid contracts</span>`:''}</button>${callBtn(l.id,l.name)}</div>`).join('')||'<div class="sm" style="padding:24px">No matching dealers</div>'}</div><div class="sm">EDS sees notes on leads it sends you and on leads you choose to share.</div>`;

 }}return v.eventOnboard}

 if(arr[idx]?.done){toast('This onboarding stage is already complete');return false}
 if(idx>0&&!arr[idx-1]?.done){toast('Complete the preceding onboarding stage first');return false}
 const stamp=new Date().toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
 arr[idx]={done:true,at:stamp+' · '+(isManual?'Manual override':'Event confirmed')};

 return html.replace(/(<section class="card col g8">)/,`$1<div class="v46-pinned"><span class="v46-pinned-label">${ic('pin',14)} Pinned dealer insights · DEMO</span>${pinned}</div>`);
};
const v46OldHome=SC.home;
SC.home=()=>{let r=v46OldHome();if(S.role==='agent'&&S.homeTab==='claims')r={...r,b:r.b+`<section class="card v46-claim-summary"><div class="between"><div class="col g4"><span class="eyebrow eb-g">AGENCY CLAIMS PAID</span><h2 class="t2">Total claims paid</h2></div>${tag('gry','Demo figures')}</div><div class="v46-metrics"><div><span>MTD</span><b>$12,850</b></div><div><span>YTD</span><b>$146,920</b></div><div><span>ITD</span><b>$1,284,700</b></div></div><p class="sm">Illustrative paid claim amounts across all contracts within this agency’s authorized scope. MTD = month to date; YTD = year to date; ITD = inception to date. Not live claims-system data. These totals are claim dollars paid, not commissions or agent-paid grey claims.</p></section>`};return r};
const v46OldTools=SC.tools;
SC.tools=()=>{const r=v46OldTools();const tile=`<button class="v5-tool" ${da('v46OpenArchive')}><span class="ti">${ic('doc',21)}</span><span class="grow"><span class="t3">Product news & announcements</span><span class="sm">${v46News.length} archived newsblasts · bulletins & feature updates</span></span>${ic('next',18)}</button>`;r.b=r.b.replace('</div>', '</div>');const at=r.b.lastIndexOf('</div>');r.b=r.b.slice(0,at)+tile+r.b.slice(at);return r};
const v46PriorLayout=layout;
layout=function(){let html=v46PriorLayout();
 if(S.v9Overlay==='notifications'){
  const marker='>Dealers</button>';
  const ix=html.indexOf(marker);
  if(ix>=0)html=html.slice(0,ix+marker.length)+`<button class="${S.v10Filter==='news'?'on':''}" ${da('v10Filter',{v:'news'})}>News</button><button class="${S.v10Filter==='performance'?'on':''}" ${da('v10Filter',{v:'performance'})}>Performance</button>`+html.slice(ix+marker.length);
 }
 const overlay=S.v9Overlay;
 let panel='';
 if(overlay==='v46Archive'){
  const selected=v46News.filter(n=>S.v46ArchiveFilter==='all'||n.category===S.v46ArchiveFilter);
  panel=`<section class="v9-overlay v46-overlay" role="dialog" aria-label="Product announcements archive"><div class="v9-overlay-head between"><div class="col g4"><span class="eyebrow eb-g">TOOLS · NEWS ARCHIVE</span><h2 class="t2">Product news & announcements</h2></div><button class="icb" ${da('v9Close')} aria-label="Close">${ic('x')}</button></div><div class="v9-overlay-body"><p class="sm">Search the archive of past product bulletins, feature releases and EDS newsblasts. All items here are fictional demonstration examples.</p><div class="v10-filterrow">${[['all','All'],['Product announcement','Products'],['Feature announcement','Features'],['Platform update','Platform']].map(([v,t])=>`<button class="${S.v46ArchiveFilter===v?'on':''}" ${da('v46ArchiveFilter',{v})}>${t}</button>`).join('')}</div>${selected.map(v46NewsItem).join('')}</div></section>`;
 }else if(overlay==='v46NewsDetail'){
  const n=v46News.find(x=>x.id===S.v46NewsSelected)||v46News[0];
  panel=`<section class="v9-overlay v46-overlay" role="dialog" aria-label="Announcement details"><div class="v9-overlay-head between"><button class="icb" ${da('v46OpenArchive')} aria-label="Back to archive">${ic('back')}</button><b>Product news & announcements</b><button class="icb" ${da('v9Close')} aria-label="Close">${ic('x')}</button></div><div class="v9-overlay-body"><span class="eyebrow eb-g">${esc(n.category)} · ${esc(n.date)}</span><h2 class="t2" style="margin:12px 0">${esc(n.title)}</h2><p>${esc(n.body)}</p><section class="card col g8"><b>What agents should know</b>${n.bullets.map(x=>`<div class="row g8">${ic('check',17)}<span class="sm">${esc(x)}</span></div>`).join('')}</section><div class="v46-news-actions"><button class="btn" ${da('v46OpenArchive')}>View all past announcements ${ic('next',16)}</button><button class="btn-o" ${da('goto',{v:'training'})}>Open training library</button></div><span class="v10-demo-note">Illustrative newsblast for the interactive prototype. Product terms and launch status must be verified before publishing.</span></div></section>`;
 }else if(overlay==='v46RiskDetail'){
  const n=S.notifications.find(x=>x.id===S.v10Selected);
  if(n){const isStop=n.id==='v46-writing-stop';panel=`<section class="v9-overlay v46-overlay" role="dialog" aria-label="Performance alert details"><div class="v9-overlay-head between"><button class="icb" ${da('v10Open')} aria-label="Back">${ic('back')}</button><b>Dealer performance insight</b><button class="icb" ${da('v9Close')} aria-label="Close">${ic('x')}</button></div><div class="v9-overlay-body"><span class="v46-alert-level ${isStop?'critical':'warn'}">${isStop?'CRITICAL · POSSIBLE STOPPAGE':'WARNING · PROJECTED DECLINE'}</span><h2 class="t2" style="margin:14px 0 5px">${esc(n.title)}</h2><b>${esc(n.dealer)}</b><p class="sm" style="margin:12px 0">${esc(n.desc)}</p><section class="card">${n.facts.map(([a,b])=>`<div class="v10-fact"><span>${esc(a)}</span><b>${esc(b)}</b></div>`).join('')}</section><section class="card col g8"><b>Why this alert appears</b><span class="sm">${isStop?'The dealer has historically written a contract at least every 1–3 days, but has had no recorded contracts for 12 days. The gap exceeds its usual activity pattern.':'Forecast formula: current MTD contracts ÷ elapsed days × total days in current month, compared with last month’s final contract count. 18 ÷ 20 × 30 = 27 projected, vs 40 last month (−32.5%). This alert fires at a decline of 15% or more.'}</span><b>Recommended next action</b><span class="sm">${isStop?'Contact the dealer immediately; check operational issues, competing products, staff changes and reporting delays.':'Check day-by-day writing patterns and pending contracts, then contact the dealer with a recovery plan.'}</span></section><button class="btn" ${da('v46RiskAction',{id:n.id})}>Open CRM and follow up ${ic('next',16)}</button><span class="v10-demo-note">Pinned, simulated signal · sample baseline. A real alert needs date-normalized Edge production data, ingestion freshness checks, and separate handling for dealer closures, holidays and newly onboarded dealers.</span></div></section>`}
 }
 return html+panel;
};

.screen-home .body:has(.v47-morning-content){background:#f2f5f2;padding:0!important;gap:0!important;overflow-y:auto!important;display:block!important}.v47-morning-content{display:flex;flex-direction:column;gap:13px;padding:14px 13px 26px}.v47-panel{background:#fff;border:1px solid #e2eae3;border-radius:19px;padding:14px 14px 13px;box-shadow:0 2px 10px #1733260a;flex-shrink:0}.v47-panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:11px}.v47-panel-head>div{display:flex;align-items:center;gap:9px;min-width:0}.v47-panel-head strong{font-size:16px;color:#13291f}.v47-panel-head>button{border:0;background:none;display:flex;align-items:center;gap:3px;color:#647269;font-size:11px;white-space:nowrap}.v47-alert-dot{width:27px;height:27px;display:grid;place-items:center;border-radius:50%;background:#fbdde1;color:#e63f51;font-weight:900;font-size:19px}.v47-graph,.v47-ann-icon{width:28px;height:28px;border-radius:9px;background:#e8f3ec;color:#005943;display:grid;place-items:center;font-weight:900;font-size:14px}.v47-rows{border:1px solid #e6ebe7;border-radius:13px;overflow:hidden}.v47-rows button{width:100%;display:flex;align-items:center;text-align:left;gap:8px;border:0;border-bottom:1px solid #e5ebe6;background:#fff;min-height:65px;padding:10px 10px}.v47-rows button:last-child{border-bottom:0}.v47-rows button:hover,.v47-quick button:hover{background:#edf7f0}.v47-rows button>span:first-child{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}.v47-rows b{font-size:13px;color:#172820;line-height:1.3}.v47-rows small,.v47-quick small{font-size:11px;color:#78847d;line-height:1.35}.v47-rows svg{color:#79857f;flex-shrink:0}.v47-flag{font-size:10px;font-weight:800;padding:5px 7px;border-radius:7px;white-space:nowrap}.v47-flag.critical{color:#b02838;background:#ffedf0}.v47-flag.warn{color:#93651e;background:#fff2d9}.v47-when{font-size:11px;color:#87918b}.v47-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.v47-stats> /* v49: Bottom-sheet-like pull-to-dismiss: the entire morning surface follows the gesture. */
(function(){
 let active=null;
 const dismissDistance=112;
 const getParts=()=>{const dev=document.querySelector('#dev');return {dev,head:dev?.querySelector('.v47-morning-head'),body:dev?.querySelector('.v47-morning-content')}};
 const move=(a,y,immediate=false)=>{
   if(!a)return;
   for(const el of [a.head,a.body]){if(!el)continue;el.classList.toggle('v49-dragging',immediate);el.style.transform=`translate3d(0,${Math.round(y)}px,0)`;}
   if(a.dev){a.dev.style.setProperty('--v49-drag',String(y));a.dev.classList.toggle('v49-pulling',immediate)}
 };
 const clear=a=>{if(!a)return;for(const el of [a.head,a.body]){if(el){el.style.transform='';el.classList.remove('v49-dragging')}}a.dev?.classList.remove('v49-pulling');a.dev?.style.removeProperty('--v49-drag')};
 document.addEventListener('pointerdown',e=>{
   if(!S.morning||S.view.n!=='home'||S.sheet)return;
   const startAt=e.target.closest('.v47-morning-head');
   if(!startAt||e.target.closest('button,a,input,select'))return;
   const p=getParts();if(!p.head||!p.body)return;
   const scale=p.dev?.getBoundingClientRect().width/p.dev.offsetWidth||1;
   active={...p,id:e.pointerId,x:e.clientX,y:e.clientY,scale,dy:0,time:performance.now()};
   // Capture on the header ensures the gesture completes even when the finger leaves the handle.
   try{p.head.setPointerCapture(e.pointerId)}catch(_e){}
 },{passive:true});
 document.addEventListener('pointermove',e=>{
   if(!active||active.id!==e.pointerId)return;
   const dx=(e.clientX-active.x)/active.scale,dy=(e.clientY-active.y)/active.scale;
   if(dy<=0||Math.abs(dx)>Math.max(48,dy*1.2)){move(active,0,true);active.dy=0;return}
   active.dy=Math.min(dy,420);
   move(active,active.dy,true);
   if(e.cancelable)e.preventDefault();
 },{passive:false});
 const finish=(e,cancelled=false)=>{
   if(!active||active.id!==e.pointerId)return;
   const a=active;active=null;
   const velocity=a.dy/Math.max(70,performance.now()-a.time);
   const dismiss=!cancelled&&(a.dy>=dismissDistance||(a.dy>48&&velocity>0.65));
   if(dismiss){
     // Match the native sheet: continue down, then reveal the original dashboard.
     move(a,Math.max(370,a.dy+260),false);
     for(const el of [a.head,a.body])if(el)el.classList.add('v49-closing');
     window.setTimeout(()=>{if(S.morning){S.morning=false;S.view={n:'home',p:{}};S.sheet=null;render()}},175);
   }else clear(a);
 };
 document.addEventListener('pointerup',e=>finish(e),{passive:true});
 document.addEventListener('pointercancel',e=>finish(e,true),{passive:true});
})();

n class="eyebrow eb-g">Agency → ${meEsc(sub.name)}</span><h2 class="t2">Business overview</h2><span class="sm">All figures below are limited to this sub-agent’s assigned dealer book. Figures are included in agency totals, not added on top.</span>${meBtn('subAgency','← Full agency')}</section><div class="me-statgrid">${meStat('Assigned dealers',ds.length)}${meStat('MTD contracts',sales)}${meStat('Prior month contracts',prev)}${meStat('Total claims',cs.length)}${meStat('Open claims',open)}${meStat('Paid claims',paid.length)}${meStat('Total claims paid',meMoney(paidAmount))}${meStat('Avg paid claim',meMoney(paid.length?paidAmount/paid.length:0))}</div><section class="card col g8"><b>Explore this book of business</b><div class="me-shortcuts">${meBtn('subClaims','Claims by dealer')}${meBtn('subSales','Sales by dealer')}</div><span class="sm">Claims supports MTD, YTD and ITD filters. Select any dealer below for Sales, Claims, CRM, Notifications and Payments.</span></section><section class="card col g8"><div class="between"><b>Assigned dealers</b><span class="sm">${ds.length} dealers</span></div>${dealerItems}</section><span class="sm">Illustrative assignments and metrics; no live sub-agent attribution connected.</span></div>`,nav:false};};
const meV52PriorClaimsBody=claimsBody;
claimsBody=function(p){if(!ME.subScope)return meV52PriorClaimsBody(p);const sub=meSubByName(ME.subScope);if(ME.claimsDealer!=='all'&&!sub.ids.includes(ME.claimsDealer))ME.claimsDealer='all';const html=meV52PriorClaimsBody(p);return html.replace('<option value="all">All agency dealers</option>','<option value="all">All '+meEsc(sub.name)+' dealers</option>').replace(/<option value="(hill|oak|lake|r12|river|summit|prairie|north)"[^>]*>[^<]*<\/option>/g,(str,id)=>sub.ids.includes(id)?str:'').replace('<span class="eyebrow eb-g">MY EDGE · AGENCY CLAIMS</span>','<span class="eyebrow eb-g">MY EDGE · '+meEsc(sub.name.toUpperCase())+' CLAIMS</span>').replace('across your dealer network','for assigned dealers').replace('<section class="card col g8"><div class="between"><div class="col g4">','<section class="card col g8">'+meBtn('subBack','← '+meEsc(sub.name))+'<div class="between"><div class="col g4">');};
const meV52PriorCRM=SC.crm;
SC.crm=()=>{if(!ME.subScope)return meV52PriorCRM();const sub=meSubByName(ME.subScope),ds=ME_DEALERS.filter(d=>sub.ids.includes(d.id)&&(d.name+' '+d.city).toLowerCase().includes(ME.dealerQuery.toLowerCase()));return {b:`<div class="me-v50"><section class="card col g8">${meBtn('subBack','← '+meEsc(sub.name))}<span class="eyebrow eb-g">ASSIGNED DEALERS</span><h2 class="t2">${meEsc(sub.name)} · Dealer directory</h2><span class="sm">Only dealers assigned to this sub-agent</span></section><label class="v5-search">${ic('search',19)}<input data-me-search="1" value="${meEsc(ME.dealerQuery)}" placeholder="Search assigned dealers" aria-label="Search assigned dealers"></label><div class="me-directory">${ds.map(d=>`<button class="me-item" data-me="dealer" data-id="${d.id}"><span class="col g4 grow"><b>${meEsc(d.name)}</b><span class="sm">${meEsc(d.city)} · ${d.sales} MTD · ${ME_CLAIMS.filter(c=>c.dealer===d.id).length} claims</span></span>${ic('next',18)}</button>`).join('')||'<span class="sm">No matching dealers</span>'}</div></div>`};};
const meV52PriorDealer=SC.dealer;
SC.dealer=()=>{const page=meV52PriorDealer(),d=meDealer(S.view.p.id),sub=meSubOfDealer(d.id);if(sub){page.b=page.b.replace('<div class="me-v50">','<div class="me-v50"><section class="card col g4"><span class="sm">Assigned sub-agent · '+meEsc(sub.name)+'</span>'+meBtn('subOpen','View sub-agent book',`data-name="${meEsc(sub.name)}"`)+'</section>');}return page;};
document.addEventListener('click',function(e){const b=e.target.closest('[data-me]');if(!b)return;const act=b.dataset.me;if(!['subOpen','subAgency','subBack','subClaims','subSales','subDealers'].includes(act))return;e.preventDefault();e.stopImmediatePropagation();if(act==='subAgency'){ME.subScope=null;ME.claimsDealer='all';ME.dealerQuery='';S.homeTab='sales';go('home');}
 else if(act==='subOpen'){ME.subScope=null;go('meSubAgent',{name:b.dataset.name});}
 else if(act==='subBack'){go('meSubAgent',{name:ME.subScope||S.view.p.name});ME.subScope=null;}
 else {const name=S.view.n==='meSubAgent'?S.view.p.name:ME.subScope;ME.subScope=name;ME.claimsDealer='all';ME.dealerQuery='';if(act==='subClaims'){S.homeTab='claims';go('home')}else if(act==='subSales'||act==='subDealers'){go('crm')}}render();},true);
